spring.application.name=BuiThiDiemTrinh_TH5


# ===============================
# KET NOI MYSQL - XAMPP
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Session cookie protection. Set COOKIE_SECURE=true when the app is served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
app.security.cookie-secure=${COOKIE_SECURE:false}

# Optional reachable base URL for staff phones; otherwise discover local Wi-Fi/LAN IPv4 addresses.
app.pos.public-url=${POS_PUBLIC_URL:}
